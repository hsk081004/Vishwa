<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="50%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFC2D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF8FB1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#FF4D8D" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="300" fill="url(#glow)"/>

  <!-- Aesthetic polaroid frame -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="640" height="780" rx="24" fill="#FFFFFF"/>
    <!-- Photo area -->
    <rect x="120" y="120" width="560" height="580" rx="16" fill="#FFE4EC"/>
    <circle cx="400" cy="410" r="160" fill="#FF8FB1" opacity="0.3"/>
    
    <!-- Central Icon & Illustration -->
    <text x="400" y="380" font-size="140" text-anchor="middle" dominant-baseline="middle">✨</text>
    <text x="400" y="520" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="bold" fill="#C2185B" text-anchor="middle">The Golden Smile</text>
    <text x="400" y="565" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#880E4F" text-anchor="middle" opacity="0.85">Pure Sunshine &amp; Kindness</text>

    <!-- Polaroid Caption Area -->
    <text x="400" y="750" font-family="'Great Vibes', cursive" font-size="44" fill="#FF4D8D" text-anchor="middle">Vishu • 7th November</text>
    <text x="400" y="795" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#C2185B" letter-spacing="3" text-anchor="middle">EXPRESSION QUEEN 💖</text>
  </g>

  <!-- Cute Sticker Corner -->
  <g transform="translate(620, 90) rotate(15)">
    <rect x="-35" y="-14" width="70" height="28" fill="#FFF275" opacity="0.85" rx="4"/>
  </g>
</svg>
